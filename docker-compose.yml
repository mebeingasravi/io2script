services:
  io2script:
    build:
      context: .
      dockerfile: Dockerfile
    image: io2script:latest
    container_name: io2script
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - INPUT_FILE=${INPUT_FILE:-data/sample.csv}
      - LOG_PATH=${LOG_PATH:-logs}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - ./data:/usr/src/app/data:ro
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
